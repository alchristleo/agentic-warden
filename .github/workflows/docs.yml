name: docs

on:
  push:
    paths:
      - "docs/**"
      - "scripts/**"
      - "examples/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - "examples/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The tapes and the quickstart check run with a temp HOME, so the Go caches are pinned.
      GOMODCACHE: ${{ github.workspace }}/.ci/gomod
      GOCACHE: ${{ github.workspace }}/.ci/gocache
      # Step 1 clones from GitHub. Point that URL at this checkout instead (also read in a temp HOME).
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.${{ github.workspace }}.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/alchristleo/agentic-warden.git
      AW_REPO: ${{ github.workspace }}
      AW_STUB_BIN: ${{ runner.temp }}/stub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          # vhs v0.12.1 needs a newer Go than go.mod asks for, so use the current stable release.
          go-version: stable
          cache: false
      - name: Build the binaries
        run: go build -o bin/ ./cmd/...
      - name: Install vhs, ffmpeg and ttyd
        run: |
          go install github.com/charmbracelet/vhs@v0.12.1
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Add a stub claude
        # aw doctor prints its "file:" line only when claude is on PATH. Steps 6 and 7 of the
        # quickstart that run a real Claude are marked check: skip, so a stub is enough.
        run: |
          mkdir -p "$AW_STUB_BIN"
          printf '#!/bin/sh\nexit 0\n' > "$AW_STUB_BIN/claude"
          chmod +x "$AW_STUB_BIN/claude"
          echo "$AW_STUB_BIN" >> "$GITHUB_PATH"
      - name: Test the doc checks
        run: scripts/test-checks.sh
      - name: Run the quickstart
        run: scripts/check-quickstart.sh docs/site/quickstart.md
      - name: Run the README
        run: scripts/check-quickstart.sh README.md
      - name: Render the tapes
        # docs/tapes/manual needs a logged-in Claude and is rendered by hand.
        # vhs has no no-sandbox option. If this step fails to start Chrome, the likely cause is
        # Ubuntu 24.04 AppArmor blocking unprivileged user namespaces for the sandbox.
        run: |
          mkdir -p docs/assets
          for t in docs/tapes/*.tape; do
            echo "::group::$t"
            vhs "$t"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: docs-gifs
          path: docs/assets/*.gif
          if-no-files-found: error
