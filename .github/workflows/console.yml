name: console

on:
  push:
    branches: [main]
    paths: ["console/**", "internal/**", "cmd/awd/**", "go.mod", "go.sum", ".github/workflows/console.yml"]
  pull_request:
    paths: ["console/**", "internal/**", "cmd/awd/**", "go.mod", "go.sum", ".github/workflows/console.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AWD_TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: go test ./...
      - working-directory: console
        run: pnpm install --frozen-lockfile
      - working-directory: console
        run: pnpm typecheck
      - working-directory: console
        run: pnpm test
      - working-directory: console
        run: pnpm build
      - name: Committed console build is current
        run: |
          status="$(git status --porcelain --untracked-files=all internal/console/dist)"
          if [ -n "$status" ]; then
            echo "$status"
            echo "internal/console/dist is stale or has untracked files; run 'pnpm build' in console/ and commit the result." >&2
            exit 1
          fi
      - working-directory: console
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: console
        run: pnpm test:e2e
        env:
          CI: "true"
