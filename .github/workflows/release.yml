name: release

on:
  pull_request:
    paths:
      - install.sh
      - scripts/release-build.sh
      - scripts/test-*.sh
      - .github/workflows/release.yml
      - cmd/**
      - internal/**
      - go.mod
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: scripts/release-build.sh v0.0.0-ci dist
      - run: scripts/test-release-build.sh
      - run: scripts/test-install.sh
      - run: shellcheck -s sh install.sh

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-build.sh "$TAG" dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.tar.gz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* install.sh --verify-tag --generate-notes --title "$TAG"
