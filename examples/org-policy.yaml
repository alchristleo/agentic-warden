# An organization's policy. Rules apply in order, and a later rule overrides an
# earlier one per key, so precedence is the order you write them in.
#
# Apply it with:  awd apply examples/org-policy.yaml
version: "2026-09-20.1"

# Who belongs to which group. Authored here so a membership change is a
# policy revision like any other; an identity-provider sync can replace this
# block later without changing what a machine receives.
groups:
  alice@acme.com: [platform]
  bob@acme.com: [platform, security]

rules:
  # Applies to everyone: no match block means no constraint.
  - name: baseline
    agents:
      claude:
        managed:
          permissions:
            deny:
              - Read(./.env)
              - Read(./secrets/*)
          # Permission rules come from managed settings alone; a user or
          # project file cannot widen them.
          allowManagedPermissionRulesOnly: true
        env:
          CLAUDE_CODE_ENABLE_TELEMETRY: "1"
        # Organization values replace what a developer already exports.
        forceEnv: true
      # Codex reads a machine-wide requirements.toml that aw-sync writes.
      # Scalars and allowlists replace across rules; prefix_rules accumulate.
      codex:
        managed:
          allowed_sandbox_modes: [read-only, workspace-write]
          allowed_approval_policies: [on-request, untrusted]
          rules:
            prefix_rules:
              - pattern: [{token: rm}]
                decision: forbidden
                justification: Use git clean -fd instead.
      # Gemini reads a system settings.json (overrides every user setting)
      # and an admin policy directory; aw-sync writes one file in each.
      # tools.exclude and mcp.allowed union across rules, mcpServers merge
      # by name, other settings replace, and policies accumulate. Every
      # policy rule needs toolName, decision and an integer priority 0-999.
      gemini:
        managed:
          settings:
            admin:
              secureModeEnabled: true
            tools:
              exclude: [web_fetch]
          policies:
            - toolName: run_shell_command
              commandPrefix: rm -rf
              decision: deny
              priority: 100
              denyMessage: Use git clean -fd instead.

  # Group membership comes from identity-provider claims and compares exactly.
  - name: platform-team
    match:
      groups: [platform]
    agents:
      claude:
        managed:
          model: opus

  # Repository patterns are globs, and '*' crosses path separators.
  # Permission lists union across rules rather than replacing one another.
  - name: payments-repos
    match:
      repos: ["github.com/acme/payments*"]
    agents:
      claude:
        managed:
          permissions:
            deny:
              - Bash(curl *)
      # launch is Codex's per-launch config.toml layer, applied by aw codex;
      # managed is requirements.toml, applied machine-wide by aw-sync.
      codex:
        launch:
          sandbox_mode: read-only
